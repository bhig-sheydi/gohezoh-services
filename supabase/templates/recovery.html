<div style="margin:0;padding:40px 16px;background:#f4f6ef;font-family:Arial,sans-serif;color:#173b34">
  <div style="max-width:480px;margin:0 auto;padding:32px;border:1px solid #e3e8dc;border-radius:16px;background:#fff">
    <p style="margin:0 0 20px;font-size:12px;font-weight:700;letter-spacing:2px">GOHEZOH</p>
    <h1 style="margin:0 0 14px;font-size:24px">Reset your password</h1>
    <p style="margin:0 0 24px;color:#68786f;line-height:1.6">Enter this one-time code in the Gohezoh app to choose a new password. You can stay on the same screen while you do this.</p>
    <p style="margin:0;padding:18px;border-radius:10px;background:#f4f6ef;text-align:center;font-size:30px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
    <p style="margin:24px 0 0;color:#68786f;font-size:13px;line-height:1.6">If you didn't request a password reset, you can ignore this email.</p>
  </div>
</div>
