<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6ef" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const choice = localStorage.getItem('gohezoh-theme')
        const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101a19' : '#f4f6ef'
      } catch { document.documentElement.dataset.theme = 'light' }
    </script>
    <meta name="description" content="Kwik-Parsel delivery and fulfillment, a product by Gohezo Integrated Services." />
    <style>
      .boot-screen{min-height:100svh;display:grid;place-content:center;justify-items:center;gap:18px;padding:24px;background:radial-gradient(circle at 50% 42%,#e2edcf,#f4f6ef 58%);color:#173b34;font-family:'Segoe UI',Arial,sans-serif;text-align:center}
      .boot-screen img{width:92px;height:92px;border-radius:23px;box-shadow:0 18px 38px #173b3430}
      .boot-screen strong{font-size:23px;letter-spacing:.12em}.boot-screen small{font-size:10px;letter-spacing:.18em}
      .boot-track{width:180px;height:5px;overflow:hidden;border-radius:99px;background:#d4dfc8}.boot-track::after{content:'';display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#87a746,#d6ef72,#173b34);animation:boot-move 1.35s ease-in-out infinite alternate}
      @keyframes boot-move{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
      :root[data-theme='dark'] .boot-screen{background:radial-gradient(circle at 50% 42%,#254037,#101a19 58%);color:#e9f2ea}:root[data-theme='dark'] .boot-track{background:#334c40}
      @media(prefers-reduced-motion:reduce){.boot-track::after{animation:none;width:100%;opacity:.7}}
    </style>
    <title>Kwik-Parsel | By Gohezo Integrated Services</title>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status" aria-label="Opening Kwik-Parsel"><img src="/favicon.svg" alt="" /><strong>KWIK-PARSEL</strong><small>BY GOHEZO INTEGRATED SERVICES</small><span class="boot-track" aria-hidden="true"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
