<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6ef" />
    <script>
      try {
        const choice = localStorage.getItem('gohezoh-theme')
        const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101a19' : '#f4f6ef'
      } catch { document.documentElement.dataset.theme = 'light' }
    </script>
    <meta name="description" content="Gohezoh logistics and fulfillment services." />
    <title>Gohezoh | Logistics &amp; Fulfillment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
